[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:ttyd]
command=ttyd -p 7681 -i 127.0.0.1 -W -t fontFamily="'JetBrains Mono', monospace" -t fontSize=15 bash
directory=/data
user=dev
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:wede]
command=sudo -u dev wede /data --port 9090
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
